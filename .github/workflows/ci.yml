name: Engine checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/audit_simulator.py --check
      - run: python scripts/audit_bga_targets.py --check
      - run: python scripts/generate_card_data.py --check
      - run: python -m unittest discover -s tests -p test_bga_targets.py -v
      - run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build build --parallel 2
      - run: ctest --test-dir build --output-on-failure
      - run: python -m unittest discover -s tests -p 'test_gui*.py' -v
